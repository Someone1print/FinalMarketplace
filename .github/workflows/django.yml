name: Django CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # requirements.txt заморожен под Python 3.8-3.10 (Django 4.1)
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff

    - name: Lint (critical errors)
      run: ruff check --select E9,F63,F7,F82 apps Finalmarketplace

    - name: Run tests
      env:
        DB_ENGINE: sqlite3
      run: python manage.py test apps --verbosity 2
